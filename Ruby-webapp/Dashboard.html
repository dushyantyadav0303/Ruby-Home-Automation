<!DOCTYPE html>
<html lang="en" >

<head>
    <link rel="stylesheet" href="dashboard.css">
    <script src="Dashboard.js" type="module" defer></script>
     <link rel="icon" type="image/x-icon" href="assets/ruby.ico">
</head>

<body>

<section id="home" class="page">
    <div class="home-wrap">
   
        <div class="home-sensors">
            <div class="home-stat">
                <span id="home-temp">--°C</span>
                <label>Temp</label>
            </div>


            <div class="home-stat">
                <span id="home-humidity">--%</span>
                <label>Humidity</label>
            </div>
        </div>

        <h2 class="section-title">Room Controls</h2>
        <div class="controls-grid">        
            

            <div class="controls-grid">
    <div class="control-card">
        <div class="control-title">
            <img id="light1-icon" src="assets/bulb-off.png" class="light-icon">
            <span>Light 1</span>
        </div>
        <label class="switch">
            <input type="checkbox" id="light1-toggle">
            <span class="slider round"></span>
        </label>
    </div>






    <div class="control-card">
        <div class="control-title">
            <img id="light2-icon" src="assets/bulb-off.png" class="light-icon">
            <span>Light 2</span>
        </div>
        <label class="switch">
            <input type="checkbox" id="light2-toggle">
            <span class="slider round"></span>
        </label>
    </div>





    <div class="control-card">
        <div class="control-title">
            <img id="light3-icon" src="assets/bulb-off.png" class="light-icon">
            <span>Light 3</span>
        </div>
        <label class="switch">
            <input type="checkbox" id="light3-toggle">
            <span class="slider round"></span>
        </label>
    </div>





    <div class="control-card">
        <div class="control-title">
            <img id="light4-icon" src="assets/bulb-off.png" class="light-icon">
            <span>Light 4</span>
        </div>
        <label class="switch">
            <input type="checkbox" id="light4-toggle">
            <span class="slider round"></span>
        </label>
    </div>
</div>

            

<div class="control-card fan-card">
            <div class="fan-header">
                <div class="control-title">
                    <img id="fan-icon" src="assets/fan.png" class="fan-icon">
                    <span>Ceiling Fan</span>
                </div>
                <span id="fan-speed-display" class="fan-speed">0%</span>
            </div>
            <input type="range" id="fan-slider" min="0" max="100" step="25" value="0" class="range-slider">
            <div class="slider-labels">
                <span>Off</span>
                <span>Max</span>
            </div>
        </div>

            


        </div>

    </div>
</section>


<section id="devices" class="page">
        <div class="device-animation">
         <div class="device-title">
     <h1>My Ruby</h1>
          <p id="deviceStatus" class="status offline">
             <span class="status-dot"></span>
                offline
            </p>
        </div>
        <video muted id="device-video">
            <source src="assets/device-video.mp4" type="video/mp4" />
        </video>
    </div>

       <div class="wifi-indicator">
        <img src="assets/wifi.png" alt="Wifi">
        <span id="wifiRssi">-- dBm</span>
    </div>


 <div class="quick-stats">
        <div class="stat">
        <span class="stat-value" id="temp">--°C</span>
        <span class="stat-label">Temperature</span>
    </div>

        <div class="stat">
        <span class="stat-value" id="humidity">--%</span>
        <span class="stat-label">Humidity</span>
    </div>

<div class="stat">
        <span class="stat-value" id="uptime">--</span>
        <span class="stat-label">Uptime</span>
 </div>
</div>
    </section>
    
    
    
    <section id="profile" class="page">

    <div class="profile-wrap" id="profile-wrap">


<button type="button" id="edit-btn" class="edit-btn">
    <img src="assets/edit.png" >
</button>  

         <div class="pfp-container">
               <label for="pfp-input" class="pfp-lable" >
    <img src="assets/photo.png" id="pfp-int">
            <img id="pfp-img" style="display: none;" />
        <div class="pfp-overlay">
    <span>Change</span>
</div>
     </label>
     <input type="file" id="pfp-input" accept="image/*" />
     </div>
     

     
    <div class="profile-field">
        <label>Your Name</label>
        <div class="editable-row">
          <input type="text" id="name-input" disabled/>
        </div>
      </div>



   <div class="profile-field">
        <label>Email</label>
        <p id="email-display">user@example.com</p>
      </div>

<div class="profile-field">
            <label>Ruby device key</label>
            <div class="editable-row">
                <span id="device-key-display" class="key-display">Not Generated</span>
                <button type="button" id="gen-key-btn" class="gen-key-btn">Generate</button>
            </div>
        </div>

       <button type="button" id="logout-btn" class="logout-btn">Logout</button>
    

   </div>
</section>



<div id="deviceKeyAlert" class="key-banner">
    <img src="assets/warning.png" class="warning-icon" alt="Warning">
    <p>Please generate the Ruby device key to link your device.</p>
</div>



<nav class="bottom-nav">
        <a href="#home" class="menu">
            <img src="assets/home-icon.png" alt="">
        </a>

        <div class="bottom-nav-d">
            <a href="#devices" class="menu-d">
                <img src="assets/ruby.png" alt="">
            </a>
        </div>

        <a href="#profile" class="menu">
            <img src="assets/Profile.png" alt="">
        </a>
    </nav>

</body>
</html>
